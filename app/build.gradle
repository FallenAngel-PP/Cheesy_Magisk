plugins {
    id 'com.android.application'
}

android {
    namespace "com.fallenangel.cheesymagisk"
    compileSdk 33

    defaultConfig {
        applicationId "com.fallenangel.cheesymagisk"
        minSdk 26
        targetSdk 33
        versionCode 5
        versionName "1.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.github.cgutman:AdbLib:master-SNAPSHOT'
}